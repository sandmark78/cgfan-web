<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- 外圈 -->
  <circle cx="60" cy="60" r="56" fill="#C8402F" stroke="#D0442E" stroke-width="3"/>
  <!-- 内圈装饰 -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <circle cx="60" cy="60" r="42" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <!-- 文字：每日 -->
  <text x="60" y="44" text-anchor="middle" dominant-baseline="central"
        fill="#F2F0E9" font-family="'Noto Serif SC', serif" font-weight="900" font-size="22"
        letter-spacing="2">每日</text>
  <!-- 文字：一味 -->
  <text x="60" y="76" text-anchor="middle" dominant-baseline="central"
        fill="#F2F0E9" font-family="'Noto Serif SC', serif" font-weight="900" font-size="22"
        letter-spacing="2">一味</text>
  <!-- 底部小点装饰 -->
  <circle cx="48" cy="96" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="60" cy="98" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="72" cy="96" r="2" fill="rgba(255,255,255,0.3)"/>
</svg>